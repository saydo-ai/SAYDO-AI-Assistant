openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:

    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: 
              
              "#/components/schemas/HealthStatus"
  /actions/plan:
      post:
            operationId: planAction
                  summary: Plan an action
                  description: Converts a user request into a proposed action
                  requestBody:
                    required: true
                            content:
                       application/json:
                       schema:
                       $ref: "#/components/schemas/ActionRequest"
                       responses:
                    "200":
                    
                    
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ActionRequest:
    type: object
    properties:
      text:
      type: string
    required:
      - text
      
      
    

        

